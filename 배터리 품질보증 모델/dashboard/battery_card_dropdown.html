<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>배터리팩 품질보증</title>
<style>
  :root{
    --bg:#0b0f17;
    --card:#11161f;
    --card-border:#232a37;
    --ink:#e7ebf3;
    --ink-muted:#8a93a6;
    --ink-faint:#5b6373;
    --accent:#31d0aa;
    --pill-bg:rgba(49,208,170,0.14);
    --pill-ink:#31d0aa;
    --low:#2ec9c2;
    --high:#3b6fe0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    color:var(--ink);
    padding:28px;
    display:flex;
    justify-content:center;
  }
  .card{
    width:960px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:20px 22px;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .title-group{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .badge{
    width:22px;height:22px;
    border-radius:6px;
    background:#1b2330;
    border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--ink-muted);
    font-weight:600;
  }
  .title-group h1{
    font-size:15px;
    font-weight:600;
    margin:0;
  }
  .pill{
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:999px;
    background:var(--pill-bg);
    color:var(--pill-ink);
    white-space:nowrap;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin:12px 0 2px;
  }
  .controls label{
    font-size:12px;
    color:var(--ink-muted);
  }
  .controls select{
    background:#1b2330;
    border:1px solid var(--card-border);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:6px 10px;
    border-radius:8px;
    outline:none;
  }
  .controls select:focus{ border-color:var(--accent); }
  .subhead{
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--ink-muted);
    font-size:13px;
    margin:10px 0 2px;
  }
  .subhead b{ color:var(--ink); font-weight:600; font-size:13px;}
  .subhead .file{ color:var(--ink-muted); }
  .timestamp{
    text-align:right;
    color:var(--ink-faint);
    font-size:11.5px;
    margin-top:2px;
  }
  .body-row{
    display:flex;
    gap:22px;
    margin-top:14px;
  }
  .heat-col{ flex:1; min-width:0; }
  .heat-caption{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-muted);
    margin-bottom:8px;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--ink-faint);
  }
  .legend .bar{
    width:70px;height:8px;border-radius:4px;
    background:linear-gradient(90deg,var(--low),var(--high));
  }
  table.grid{
    border-collapse:separate;
    border-spacing:3px;
    width:100%;
  }
  table.grid th{
    font-size:10px;
    color:var(--ink-faint);
    font-weight:500;
    padding-bottom:4px;
  }
  table.grid td.rowlabel{
    font-size:10px;
    color:var(--ink-faint);
    padding-right:6px;
    text-align:right;
    white-space:nowrap;
  }
  table.grid td.cell{
    width:38px;height:20px;
    border-radius:4px;
    transition:background 0.25s ease;
  }
  .side{
    width:200px;
    flex:none;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .stat{
    padding-bottom:10px;
    border-bottom:1px solid var(--card-border);
  }
  .stat:last-of-type{ border-bottom:none; }
  .stat .label{ font-size:12px; color:var(--ink-muted); margin-bottom:4px;}
  .stat .value{ font-size:20px; font-weight:600; color:var(--ink); }
  .stat .value.small{ font-size:15px; font-weight:600; }
  .ai-block .label-row{
    display:flex; justify-content:space-between; align-items:center;
  }
  .ai-btn{
    font-size:11px;
    color:var(--ink-muted);
    background:#1b2330;
    border:1px solid var(--card-border);
    border-radius:7px;
    padding:5px 9px;
    white-space:nowrap;
  }
  .ai-note{
    font-size:11.5px;
    color:var(--ink-faint);
    margin-top:6px;
    line-height:1.5;
  }
  .footnote{
    margin-top:14px;
    font-size:11px;
    color:var(--ink-faint);
  }
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="title-group">
      <div class="badge">03</div>
      <h1>배터리팩 품질보증</h1>
    </div>
    <span class="pill" id="statusPill">정상 팩 데이터</span>
  </div>

  <div class="controls">
    <label for="packSel">팩 번호</label>
    <select id="packSel">
      <option value="1000">1000</option>
      <option value="1001">1001</option>
      <option value="1002">1002</option>
      <option value="1003">1003</option>
      <option value="1004">1004</option>
      <option value="1005">1005</option>
    </select>
    <label for="modeSel">모드</label>
    <select id="modeSel">
      <option value="chg">충전 (chg)</option>
      <option value="dchg">방전 (dchg)</option>
    </select>
  </div>

  <div class="timestamp" id="ts">해당 모드 마지막 측정 시점 스냅샷 (원본 데이터에 타임스탬프 없음)</div>
  <div class="subhead">
    <b id="modeLabel">충전 시험</b> · Serial <span id="serial">1000</span>
    <span class="file" id="fname">1000_chg.csv</span>
    <span id="nrows"></span>
  </div>

  <div class="body-row">
    <div class="heat-col">
      <div class="heat-caption">
        <span>셀 전압 분포&nbsp;&nbsp;16개 모듈 × 11개 셀</span>
        <div class="legend">
          <span id="legMin">-</span>
          <span class="bar"></span>
          <span id="legMax">-</span>
        </div>
      </div>
      <table class="grid" id="gridTable"></table>
    </div>

    <div class="side">
      <div class="stat">
        <div class="label">최저 셀 전압</div>
        <div class="value" id="vMin">-</div>
      </div>
      <div class="stat">
        <div class="label">최고 셀 전압</div>
        <div class="value" id="vMax">-</div>
      </div>
      <div class="stat">
        <div class="label">분석 채널</div>
        <div class="value">208 개</div>
      </div>
      <div class="stat ai-block">
        <div class="label-row">
          <div class="label">AI 품질 판정</div>
          <div class="ai-btn">모델 연결 대기</div>
        </div>
        <div class="ai-note">셀 전압·온도 원시 채널에서 계산<br>충방전 파일은 구분하여 분석</div>
      </div>
    </div>
  </div>
  <div class="footnote">색상은 전압 크기이며, 정상/불량 판정 색상이 아닙니다. (샘플: 1000~1005번 정상 팩, 각 모드 마지막 측정 행 기준)</div>
</div>

function colorFor(v, vmin, vmax){
  const t = (v - vmin) / (vmax - vmin || 1);
  const lowH=172, lowS=58, lowL=48;   // teal
  const highH=222, highS=62, highL=52; // blue
  const h = lowH + (highH-lowH)*t;
  const s = lowS + (highS-lowS)*t;
  const l = lowL + (highL-lowL)*t;
  return `hsl(${h.toFixed(0)},${s.toFixed(0)}%,${l.toFixed(0)}%)`;
}

  if(!d){ return; }

  const grid = d.grid;
  const vmin = d.vmin, vmax = d.vmax;
  const nRows = grid.length, nCols = grid[0].length;

  const table = document.getElementById('gridTable');
  let html = '<tr><th></th>';
  for(let c=0;c<nCols;c++){ html += `<th>M${String(c+1).padStart(2,'0')}</th>`; }
  html += '</tr>';
  for(let r=0;r<nRows;r++){
    html += `<tr><td class="rowlabel">C${String(r+1).padStart(2,'0')}</td>`;
    for(let c=0;c<nCols;c++){
      const v = grid[r][c];
      html += `<td class="cell" style="background:${colorFor(v,vmin,vmax)}" title="M${String(c+1).padStart(2,'0')} C${String(r+1).padStart(2,'0')}: ${v.toFixed(3)}V"></td>`;
    }
    html += '</tr>';
  }
  table.innerHTML = html;

  document.getElementById('legMin').textContent = vmin.toFixed(3)+'V';
  document.getElementById('legMax').textContent = vmax.toFixed(3)+'V';
  document.getElementById('vMin').textContent = vmin.toFixed(3)+' V';
  document.getElementById('vMax').textContent = vmax.toFixed(3)+' V';
  document.getElementById('serial').textContent = d.pack;
  document.getElementById('fname').textContent = d.fname;
  document.getElementById('nrows').textContent = `· 총 ${d.nrows.toLocaleString()}행`;
  document.getElementById('modeLabel').textContent = mode === 'chg' ? '충전 시험' : '방전 시험';
}

document.getElementById('packSel').addEventListener('change', render);
document.getElementById('modeSel').addEventListener('change', render);
render();
</script>
</body>
</html>
